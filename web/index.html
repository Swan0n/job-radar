<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Radar — вакансии под твоё резюме</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">Job Radar <span id="subtitle"></span></div>
    <div class="progress" id="progress" hidden>
      <div class="spinner"></div><span id="progress-text"></span>
    </div>
    <select class="btn ghost" id="lang" data-i18n-title="header.lang"></select>
    <button class="btn ghost" id="btn-settings" data-i18n="header.settings">Настройки</button>
    <button class="btn primary" id="btn-scan">Обновить сейчас</button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main>
  <div id="notices"></div>

  <div class="toolbar">
    <input class="search" id="search" type="search" data-i18n-placeholder="toolbar.search" placeholder="Поиск по названию, компании и описанию…">
    <select id="source-filter">
      <option value="" data-i18n="toolbar.allSources">Все источники</option>
    </select>
    <select id="period">
      <option value="" data-i18n="period.all">За всё время</option>
      <option value="1" data-i18n="period.1">За сегодня</option>
      <option value="3" data-i18n="period.3">За 3 дня</option>
      <option value="7" data-i18n="period.7">За 7 дней</option>
    </select>
    <select id="sort">
      <option value="score" data-i18n="sort.score">По совпадению</option>
      <option value="new" data-i18n="sort.new">Сначала новые</option>
      <option value="salary" data-i18n="sort.salary">По зарплате</option>
    </select>
  </div>

  <div id="list"></div>
</main>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
