[project]
name = "job-radar"
version = "0.1.0"
description = "Агрегатор вакансий по Украине с матчингом под резюме и кавер-леттерами"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "feedparser>=6.0",
    "apscheduler>=3.10",
    "anthropic>=0.40",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "playwright>=1.49",
]

[tool.uv]
package = false
